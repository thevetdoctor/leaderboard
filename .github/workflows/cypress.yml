name: E2E Tests (Cypress)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      # Start your dev server
      - name: Start app
        run: npm run dev &

      - name: Wait for app to boot
        run: sleep 30s
        shell: bash

      - name: Verify Cypress
        run: npx cypress verify

    #   - name: Run Cypress tests
    #     run: |
    #       echo "NODE_OPTIONS before: $NODE_OPTIONS"
    #       unset NODE_OPTIONS
    #       npx cypress run --browser chrome
    #     shell: bash

    # If you encounter memory issues, uncomment the following lines to adjust Node.js options
    # echo "Setting NODE_OPTIONS to --max-old-space-size=4096"
    # export NODE_OPTIONS=--max-old-space-size=4096
    # echo "NODE_OPTIONS after: $NODE_OPTIONS"
    # After tests, you can unset NODE_OPTIONS if needed to avoid affecting other steps
    # echo "NODE_OPTIONS before: $NODE_OPTIONS"
    # unset NODE_OPTIONS
    
  install:
    runs-on: ubuntu-latest
    container:
      image: cypress/browsers:22.16.0
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cypress install
        uses: cypress-io/github-action@v6
        with:
          runTests: false
      # report machine parameters
      - run: yarn cypress info
      - run: node --version
      - run: node -p 'os.cpus()'
      - run: yarn types
      - run: yarn lint
      - run: yarn test:unit:ci
      - run: yarn build:ci

      - name: Save build folder
        uses: actions/upload-artifact@v4
        with:
          name: build
          if-no-files-found: error
          path: build

  ui-chrome-tests:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: cypress/browsers:22.16.0
      options: --user 1001
    needs: install
    strategy:
      # when one test fails, DO NOT cancel the other
      # containers, because this will kill Cypress processes
      # leaving Cypress Cloud hanging ...
      # https://github.com/cypress-io/github-action/issues/48
      fail-fast: false
      matrix:
        # run copies of the current job in parallel
        containers: [1, 2, 3, 4, 5]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the build folders
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build

      - name: Node info
        run: node -v

      - name: __e Dir
        run: ls /__e

      - name: "UI Tests - Chrome"
        uses: cypress-io/github-action@v6
        with:
          build: yarn cypress info
          start: yarn start:ci
          wait-on: "http://localhost:3000"
          wait-on-timeout: 120
          browser: chrome
          record: true
          parallel: true
          group: "UI - Chrome"
          spec: cypress/tests/ui/*
          config-file: cypress.config.ts
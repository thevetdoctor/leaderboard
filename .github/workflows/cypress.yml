name: E2E Tests (Cypress)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    container:
      image: cypress/browsers:22.16.0
      options: --user 1001

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.16

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Start your dev server in the background
      - name: Start app and wait
        run: |
          npm run dev &
          npx wait-on http://localhost:5173

      # # 5️⃣ Wait for app to be ready
      # - name: Wait for app
      #   run: sleep 30s
      #   shell: bash

      # 6️⃣ Verify Cypress installation
      - name: Verify Cypress
        run: npx cypress verify

      # 7️⃣ Run Cypress tests in Chrome
      - name: Run Cypress tests
        run: npx cypress run --browser chrome

    # If you encounter memory issues, uncomment the following lines to adjust Node.js options
    # echo "Setting NODE_OPTIONS to --max-old-space-size=4096"
    # export NODE_OPTIONS=--max-old-space-size=4096
    # echo "NODE_OPTIONS after: $NODE_OPTIONS"
    # After tests, you can unset NODE_OPTIONS if needed to avoid affecting other steps
    # echo "NODE_OPTIONS before: $NODE_OPTIONS"
    # unset NODE_OPTIONS
